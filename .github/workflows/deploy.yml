name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Dvakrát denně (UTC) přetáhne aktuální obsazenost z kalendáře a nasadí web.
    - cron: "0 5,17 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm install (ne npm ci): sharp ma optional wasm podstrom (@emnapi), ktery
      # npm na Windows neumi zapsat do locku tak, aby ho prisne npm ci na Linuxu
      # prijalo (cross-platform optional-dep limit). npm install si graf doresolvi.
      - run: npm install --no-audit --no-fund
      # Chromium pro prerender (scripts/prerender.mjs) — AI crawleri nespousti JS,
      # proto se pri buildu uklada hotove HTML kazde routy. Headless launch pouziva
      # chromium-headless-shell ("install chromium" samotny ho nestahuje).
      - run: npx playwright install chromium-headless-shell --with-deps
      - run: npm run lint
      - run: npm run build
        env:
          VITE_BASE_PATH: /
          # Přístup k neveřejnému Google Kalendáři přes Calendar API.
          # Vše se drží v GitHub secrets, nikdy v repu (zero-secrets).
          # Když nejsou nastavené, build použije pre-committed availability.json.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          # Volitelná záloha: veřejný iCal feed, pokud by se API nepoužilo.
          AVAILABILITY_ICS_URL: ${{ secrets.AVAILABILITY_ICS_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
